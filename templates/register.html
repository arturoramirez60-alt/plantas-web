{% extends "base.html" %}
{% block content %}
<main class="page-main auth-page"><section class="auth-panel"><p class="eyebrow"><span class="eyebrow-line"></span> Un jardín empieza con una decisión</p><h1>Únete a Raíz.</h1><form method="post" class="stacked-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Nombre visible<input name="username" minlength="3" maxlength="80" autocomplete="username" required></label><label>Correo electrónico<input type="email" name="email" autocomplete="email" required></label><label>Contraseña<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Ciudad (opcional)<input name="city" maxlength="120" autocomplete="address-level2" placeholder="Ciudad de México"></label><p class="form-help">Tu correo y ubicación no se muestran en la comunidad. Decide por separado si quieres registrar y publicar un huerto.</p><button class="button button-dark" type="submit">Crear cuenta <span aria-hidden="true">↗</span></button></form><p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p></section></main>
{% endblock %}
