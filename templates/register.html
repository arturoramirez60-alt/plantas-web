{% extends "base.html" %}
{% block content %}
<main class="page-main auth-page"><section class="auth-panel"><p class="eyebrow"><span class="eyebrow-line"></span> Un jardín empieza con una decisión</p><h1>Únete a Raíz.</h1><form method="post" class="stacked-form"><label>Nombre visible<input name="username" minlength="3" maxlength="80" autocomplete="username" required></label><label>Correo electrónico<input type="email" name="email" autocomplete="email" required></label><label>Contraseña<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Ciudad<input name="city" maxlength="120" autocomplete="address-level2" placeholder="Ciudad de México"></label><div class="location-fields"><label>Latitud (opcional)<input type="number" name="lat" min="-90" max="90" step="any" placeholder="19.4326"></label><label>Longitud (opcional)<input type="number" name="lng" min="-180" max="180" step="any" placeholder="-99.1332"></label></div><label class="checkbox-label"><input type="checkbox" name="community_opt_in" value="yes"><span>Quiero aparecer en el mapa comunitario. Se mostrarán mi nombre, ciudad, cultivos y correo para contacto.</span></label><button class="button button-dark" type="submit">Crear cuenta <span aria-hidden="true">↗</span></button></form><p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p></section></main>
{% endblock %}
